@if (boardConfig$ | async; as config) {
  <div class="game" [style.--background]="config.backgroundColor" [style.--foreground]="config.valueFontColor" [style.--accent]="config.mainBorderColor">
    <header class="bar">
      <span class="time">{{ formatElapsed((elapsed$ | async) ?? 0) }}</span>
      <div class="bar-actions">
        @if (!isStopped(config.timer)) {
          <button (click)="templateActions$.next(['togglePause', null])">{{ isPaused(config.timer) ? 'resume' : 'pause' }}</button>
        }
        <button (click)="newGame$.next()">new game</button>
      </div>
    </header>

    <div class="board-area" (hksResize)="resize$.next($event)">
      <canvas hks-sudoku-board (selectPosition)="templateActions$.next(['select', $event])" [config]="config"></canvas>
    </div>

    <div class="tools">
      <button [class.active]="config.hintMode" (click)="templateActions$.next(['hintMode', !config.hintMode])">notes</button>
      <button (click)="templateActions$.next(['set', ''])">delete</button>
    </div>

    <div class="pad" [style.--columns]="padColumns(config.alphabet.length)">
      @for (item of config.alphabet; track item; let i = $index) {
        <button [class.complete]="config.remainingCounts[i] === 0" (click)="templateActions$.next(['set', item])">
          {{ item }}
          <span class="remaining">{{ config.remainingCounts[i] }}</span>
        </button>
      }
    </div>
  </div>
}
