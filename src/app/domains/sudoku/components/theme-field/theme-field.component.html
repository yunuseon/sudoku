@let f = field();

<div class="field">
  <span class="label">{{ f.label }}</span>

  @switch (f.type) {
    @case ('color') {
      <span class="color">
        @if (alpha() !== null) {
          <input class="slider" type="range" min="0" max="1" step="0.01" [value]="alpha()" (input)="changeAlpha(number($event))" />
        }
        <label class="swatch" [style.background]="value()">
          <input type="color" [value]="color()" (input)="changeColor(text($event))" />
        </label>
      </span>
    }
    @case ('range') {
      <span class="range">
        <input class="slider" type="range" [min]="f.min" [max]="f.max" [step]="f.step" [value]="value()" (input)="valueChange.emit(number($event))" />
        <span class="number">{{ value() }}</span>
      </span>
    }
    @case ('toggle') {
      <label class="switch">
        <input type="checkbox" [checked]="value()" (change)="valueChange.emit(checked($event))" />
        <span class="knob"></span>
      </label>
    }
    @case ('choice') {
      <span class="choices">
        @for (option of f.options; track option.value) {
          <button type="button" [class.active]="option.value === value()" [style.font-family]="option.value" (click)="valueChange.emit(option.value)">{{ option.label }}</button>
        }
      </span>
    }
  }
</div>
